<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Pentru Directori Executivi: the whole project portfolio at a glance (each project's status and
       progress), the portfolio split in a donut chart, an executive report with the compliance
       shield, an early risk alert and the audit trail. Site colours (navy, mint; amber/red = risk). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- No background of its own: the page's box draws it (illustration-bg in src/index.css). -->

  <!-- Portfolio -->
  <rect x="86" y="96" width="270" height="408" rx="16" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="2"/>
  <rect x="106" y="118" width="110" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="106" y="136" width="70" height="6" rx="3" fill="#94a3b8" opacity=".5"/>

  <rect x="102" y="158" width="238" height="58" rx="10" fill="#0f2d56"/>
  <circle cx="122" cy="178" r="6" fill="#34d399"/>
  <rect x="136" y="174" width="118" height="8" rx="4" fill="#e2e8f0" opacity=".85"/>
  <rect x="136" y="196" width="186" height="7" rx="3.5" fill="#173f73"/>
  <rect x="136" y="196" width="150" height="7" rx="3.5" fill="#34d399"/>

  <rect x="102" y="226" width="238" height="58" rx="10" fill="#0f2d56"/>
  <circle cx="122" cy="246" r="6" fill="#34d399"/>
  <rect x="136" y="242" width="96" height="8" rx="4" fill="#e2e8f0" opacity=".85"/>
  <rect x="136" y="264" width="186" height="7" rx="3.5" fill="#173f73"/>
  <rect x="136" y="264" width="112" height="7" rx="3.5" fill="#34d399"/>

  <rect x="102" y="294" width="238" height="58" rx="10" fill="#0f2d56" stroke="#fbbf24" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="122" cy="314" r="6" fill="#fbbf24"/>
  <rect x="136" y="310" width="126" height="8" rx="4" fill="#e2e8f0" opacity=".85"/>
  <rect x="136" y="332" width="186" height="7" rx="3.5" fill="#173f73"/>
  <rect x="136" y="332" width="84" height="7" rx="3.5" fill="#fbbf24"/>

  <rect x="102" y="362" width="238" height="58" rx="10" fill="#0f2d56"/>
  <circle cx="122" cy="382" r="6" fill="#34d399"/>
  <rect x="136" y="378" width="104" height="8" rx="4" fill="#e2e8f0" opacity=".85"/>
  <rect x="136" y="400" width="186" height="7" rx="3.5" fill="#173f73"/>
  <rect x="136" y="400" width="170" height="7" rx="3.5" fill="#34d399"/>

  <rect x="102" y="430" width="238" height="58" rx="10" fill="#0f2d56" stroke="#ef4444" stroke-opacity=".55" stroke-width="1.5"/>
  <circle cx="122" cy="450" r="6" fill="#ef4444"/>
  <rect x="136" y="446" width="88" height="8" rx="4" fill="#e2e8f0" opacity=".85"/>
  <rect x="136" y="468" width="186" height="7" rx="3.5" fill="#173f73"/>
  <rect x="136" y="468" width="46" height="7" rx="3.5" fill="#ef4444"/>

  <!-- Portfolio split -->
  <g stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6">
    <line x1="356" y1="200" x2="384" y2="200"/>
    <line x1="356" y1="400" x2="384" y2="400"/>
  </g>
  <rect x="384" y="96" width="262" height="220" rx="16" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="2"/>
  <rect x="404" y="118" width="90" height="8" rx="4" fill="#94a3b8" opacity=".5"/>
  <g fill="none" stroke-width="22" transform="rotate(-90 468 222)">
    <circle cx="468" cy="222" r="52" stroke="#173f73"/>
    <circle cx="468" cy="222" r="52" stroke="#34d399" stroke-dasharray="180 327"/>
    <circle cx="468" cy="222" r="52" stroke="#aec8ea" stroke-dasharray="78 327" stroke-dashoffset="-183"/>
    <circle cx="468" cy="222" r="52" stroke="#fbbf24" stroke-dasharray="38 327" stroke-dashoffset="-264"/>
    <circle cx="468" cy="222" r="52" stroke="#ef4444" stroke-dasharray="19 327" stroke-dashoffset="-305"/>
  </g>
  <circle cx="468" cy="222" r="24" fill="#0f2d56"/>
  <rect x="456" y="218" width="24" height="8" rx="4" fill="#e2e8f0"/>
  <g>
    <circle cx="556" cy="180" r="5" fill="#34d399"/><rect x="568" y="176" width="52" height="7" rx="3.5" fill="#94a3b8" opacity=".55"/>
    <circle cx="556" cy="206" r="5" fill="#aec8ea"/><rect x="568" y="202" width="40" height="7" rx="3.5" fill="#94a3b8" opacity=".55"/>
    <circle cx="556" cy="232" r="5" fill="#fbbf24"/><rect x="568" y="228" width="46" height="7" rx="3.5" fill="#94a3b8" opacity=".55"/>
    <circle cx="556" cy="258" r="5" fill="#ef4444"/><rect x="568" y="254" width="34" height="7" rx="3.5" fill="#94a3b8" opacity=".55"/>
  </g>

  <!-- Executive report -->
  <g filter="url(#shadow)">
    <rect x="398" y="340" width="232" height="190" rx="14" fill="#f8fafc"/>
  </g>
  <rect x="416" y="360" width="100" height="11" rx="5.5" fill="#0a1f3c"/>
  <rect x="416" y="378" width="140" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="416" y="398" width="196" height="1.5" fill="#e2e8f0"/>
  <g fill="#10b77f">
    <rect x="422" y="468" width="16" height="36" rx="3" opacity=".45"/>
    <rect x="446" y="452" width="16" height="52" rx="3" opacity=".6"/>
    <rect x="470" y="460" width="16" height="44" rx="3" opacity=".75"/>
    <rect x="494" y="436" width="16" height="68" rx="3"/>
  </g>
  <rect x="418" y="504" width="100" height="1.5" fill="#cbd5e1"/>
  <g fill="#cbd5e1">
    <rect x="534" y="414" width="78" height="7" rx="3.5"/>
    <rect x="534" y="430" width="62" height="7" rx="3.5"/>
    <rect x="534" y="446" width="72" height="7" rx="3.5"/>
    <rect x="534" y="462" width="54" height="7" rx="3.5"/>
  </g>
  <rect x="534" y="482" width="78" height="22" rx="11" fill="#ecfdf4"/>
  <rect x="546" y="490" width="54" height="6" rx="3" fill="#10b77f"/>

  <!-- Compliance shield on the report -->
  <circle cx="626" cy="344" r="30" fill="#6ee7a8" opacity=".25"/>
  <circle cx="626" cy="344" r="23" fill="#10b77f"/>
  <path d="M626 331l11 4v8c0 7-4.5 12-11 14-6.5-2-11-7-11-14v-8z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="m621 344 3.5 3.5 6-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Early risk alert -->
  <line x1="646" y1="150" x2="684" y2="132" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>
  <circle cx="708" cy="120" r="32" fill="#fbbf24" opacity=".18"/>
  <circle cx="708" cy="120" r="23" fill="#fbbf24"/>
  <g fill="none" stroke="#061426" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M699 126v-7a9 9 0 0 1 18 0v7l2 3h-22z"/>
    <path d="M705 133a3 3 0 0 0 6 0"/>
  </g>
  <circle cx="719" cy="108" r="5" fill="#ef4444" stroke="#061426" stroke-width="1.5"/>

  <!-- Audit trail -->
  <line x1="646" y1="270" x2="690" y2="270" stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6"/>
  <rect x="690" y="228" width="44" height="130" rx="22" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="2"/>
  <line x1="712" y1="250" x2="712" y2="336" stroke="#1d4f8f" stroke-width="2"/>
  <g fill="#6ee7a8" stroke="#0a1f3c" stroke-width="2">
    <circle cx="712" cy="252" r="6"/>
    <circle cx="712" cy="280" r="6"/>
    <circle cx="712" cy="308" r="6"/>
    <circle cx="712" cy="336" r="6" fill="#aec8ea"/>
  </g>
</svg>
