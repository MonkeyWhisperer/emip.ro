<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Pentru Manageri de Proiect: one dashboard with the project's indicators, planned vs actual
       progress, the timesheet calendar with validated days and the budget lines; a budget-deviation
       alert and a MIPE report generated with one click. Site colours (navy, mint; amber = alert). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="screen"><rect x="150" y="100" width="500" height="380" rx="9"/></clipPath>
  </defs>

  <!-- No background of its own: the page's box draws it (illustration-bg in src/index.css). -->

  <!-- Dashboard window -->
  <rect x="140" y="90" width="520" height="400" rx="16" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="150" y="100" width="500" height="380" fill="#061426"/>
    <rect x="150" y="100" width="500" height="22" fill="#0f2d56"/>
    <circle cx="162" cy="111" r="3" fill="#1d4f8f"/>
    <circle cx="172" cy="111" r="3" fill="#1d4f8f"/>
    <circle cx="182" cy="111" r="3" fill="#1d4f8f"/>
    <rect x="212" y="106" width="170" height="10" rx="5" fill="#0a1f3c"/>

    <rect x="150" y="122" width="50" height="358" fill="#0a1f3c"/>
    <circle cx="175" cy="140" r="5" fill="#6ee7a8"/>
    <circle cx="167" cy="133" r="2.5" fill="#6ee7a8" opacity=".8"/>
    <circle cx="183" cy="133" r="2.5" fill="#6ee7a8" opacity=".8"/>
    <circle cx="167" cy="147" r="2.5" fill="#6ee7a8" opacity=".8"/>
    <circle cx="183" cy="147" r="2.5" fill="#6ee7a8" opacity=".8"/>
    <rect x="156" y="164" width="38" height="14" rx="5" fill="#6ee7a8" opacity=".15"/>
    <rect x="162" y="168" width="26" height="6" rx="3" fill="#6ee7a8"/>
    <rect x="162" y="186" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
    <rect x="162" y="204" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
    <rect x="162" y="222" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
    <rect x="162" y="240" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>

    <!-- Indicators -->
    <rect x="210" y="134" width="98" height="54" rx="8" fill="#0f2d56"/>
    <circle cx="234" cy="161" r="13" fill="none" stroke="#173f73" stroke-width="5"/>
    <circle cx="234" cy="161" r="13" fill="none" stroke="#6ee7a8" stroke-width="5" stroke-dasharray="58 82" stroke-linecap="round" transform="rotate(-90 234 161)"/>
    <rect x="254" y="150" width="42" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
    <rect x="254" y="162" width="30" height="9" rx="4.5" fill="#e2e8f0"/>

    <rect x="318" y="134" width="98" height="54" rx="8" fill="#0f2d56"/>
    <rect x="330" y="146" width="42" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
    <rect x="330" y="160" width="44" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="380" y="160" width="26" height="10" rx="5" fill="#34d399" opacity=".3"/>
    <path d="m387 167 6-5 6 5" fill="none" stroke="#6ee7a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

