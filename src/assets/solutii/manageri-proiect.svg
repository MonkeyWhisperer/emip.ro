    <rect x="498" y="210" width="60" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
    <g fill="#34d399">
      <rect x="498" y="228" width="22" height="20" rx="4"/><rect x="526" y="228" width="22" height="20" rx="4"/><rect x="554" y="228" width="22" height="20" rx="4"/><rect x="582" y="228" width="22" height="20" rx="4"/><rect x="610" y="228" width="22" height="20" rx="4" fill="#173f73"/>
      <rect x="498" y="254" width="22" height="20" rx="4"/><rect x="526" y="254" width="22" height="20" rx="4"/><rect x="554" y="254" width="22" height="20" rx="4"/><rect x="582" y="254" width="22" height="20" rx="4"/><rect x="610" y="254" width="22" height="20" rx="4" fill="#173f73"/>
      <rect x="498" y="280" width="22" height="20" rx="4"/><rect x="526" y="280" width="22" height="20" rx="4"/><rect x="554" y="280" width="22" height="20" rx="4" fill="#fbbf24"/><rect x="582" y="280" width="22" height="20" rx="4"/><rect x="610" y="280" width="22" height="20" rx="4" fill="#173f73"/>
      <rect x="498" y="306" width="22" height="20" rx="4"/><rect x="526" y="306" width="22" height="20" rx="4" fill="#173f73"/><rect x="554" y="306" width="22" height="20" rx="4" fill="#173f73"/><rect x="582" y="306" width="22" height="20" rx="4" fill="#173f73"/><rect x="610" y="306" width="22" height="20" rx="4" fill="#173f73"/>
