    <rect x="222" y="372" width="64" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
    <rect x="222" y="394" width="70" height="7" rx="3.5" fill="#94a3b8" opacity=".45"/>
    <rect x="306" y="392" width="300" height="11" rx="5.5" fill="#173f73"/>
    <rect x="306" y="392" width="196" height="11" rx="5.5" fill="#6ee7a8"/>
    <rect x="222" y="418" width="56" height="7" rx="3.5" fill="#94a3b8" opacity=".45"/>
    <rect x="306" y="416" width="300" height="11" rx="5.5" fill="#173f73"/>
    <rect x="306" y="416" width="282" height="11" rx="5.5" fill="#fbbf24"/>
    <rect x="222" y="442" width="76" height="7" rx="3.5" fill="#94a3b8" opacity=".45"/>
    <rect x="306" y="440" width="300" height="11" rx="5.5" fill="#173f73"/>
    <rect x="306" y="440" width="138" height="11" rx="5.5" fill="#aec8ea" opacity=".8"/>
    <line x1="576" y1="386" x2="576" y2="456" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 3" opacity=".6"/>
    <circle cx="622" cy="421.5" r="8" fill="#fbbf24"/>
    <path d="M622 417v5" stroke="#061426" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="622" cy="425.5" r="1.3" fill="#061426"/>
  </g>

  <!-- Alert: deviation from the budget -->
  <g filter="url(#shadow)">
    <rect x="548" y="54" width="196" height="58" rx="14" fill="#f8fafc"/>
  </g>
  <circle cx="576" cy="83" r="14" fill="#fbbf24"/>
  <path d="M576 76v8" stroke="#061426" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="576" cy="89" r="1.7" fill="#061426"/>
  <rect x="600" y="72" width="118" height="8" rx="4" fill="#0a1f3c"/>
  <rect x="600" y="87" width="86" height="7" rx="3.5" fill="#cbd5e1"/>

  <!-- MIPE report, one click -->
  <g filter="url(#shadow)">
    <rect x="62" y="372" width="156" height="180" rx="14" fill="#f8fafc"/>
  </g>
  <rect x="78" y="390" width="74" height="10" rx="5" fill="#0a1f3c"/>
  <rect x="78" y="406" width="100" height="6" rx="3" fill="#cbd5e1"/>
  <g fill="#e2e8f0">
    <rect x="78" y="424" width="124" height="14" rx="3"/>
    <rect x="78" y="444" width="124" height="14" rx="3"/>
    <rect x="78" y="464" width="124" height="14" rx="3"/>
  </g>
  <g fill="#94a3b8" opacity=".6">
    <rect x="84" y="429" width="40" height="4" rx="2"/><rect x="150" y="429" width="30" height="4" rx="2"/>
    <rect x="84" y="449" width="48" height="4" rx="2"/><rect x="150" y="449" width="24" height="4" rx="2"/>
    <rect x="84" y="469" width="36" height="4" rx="2"/><rect x="150" y="469" width="34" height="4" rx="2"/>
  </g>
  <rect x="78" y="496" width="124" height="30" rx="15" fill="#10b77f"/>
  <path d="M140 503v11m-5-5 5 5 5-5M133 519h14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="516" r="11" fill="none" stroke="#6ee7a8" stroke-width="1.5" opacity=".8"/>
  <path d="M186 516v17l4.5-4 3 7 2.6-1.1-3-6.9h6z" fill="#fff" stroke="#061426" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- The manager's goal node -->
  <circle cx="92" cy="176" r="32" fill="#6ee7a8" opacity=".18"/>
  <circle cx="92" cy="176" r="23" fill="#6ee7a8"/>
  <g fill="none" stroke="#061426" stroke-width="2.4" stroke-linecap="round">
    <circle cx="91" cy="177" r="11"/>
    <circle cx="91" cy="177" r="5.5"/>
    <path d="M91 177l11-11m0 0h-5m5 0v5"/>
  </g>
  <line x1="115" y1="176" x2="140" y2="176" stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>
</svg>
