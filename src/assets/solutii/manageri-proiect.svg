      <path d="m505 264 3 3 5-5M533 264l3 3 5-5M561 264l3 3 5-5M589 264l3 3 5-5"/>
      <path d="m505 290 3 3 5-5M533 290l3 3 5-5M589 290l3 3 5-5"/>
      <path d="m505 316 3 3 5-5"/>
