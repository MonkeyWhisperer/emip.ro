<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Online mentoring on a business plan: the mentor's video tile with an idea bubble, the
       business plan with ticked sections and a growth chart, and the site's mint network nodes
       (goal, team). Site colours (navy, mint). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d56"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity=".2"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#aec8ea" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="mentor"><rect x="70" y="78" width="280" height="210" rx="16"/></clipPath>
    <clipPath id="self"><rect x="268" y="214" width="70" height="62" rx="8"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <g transform="translate(-18 16)">
    <!-- Mentor on video -->
    <g clip-path="url(#mentor)">
      <rect x="70" y="78" width="280" height="210" fill="#0f2d56"/>
      <rect x="70" y="78" width="280" height="210" fill="url(#dots)"/>
      <ellipse cx="200" cy="288" rx="78" ry="64" fill="#10b77f"/>
      <rect x="185" y="196" width="30" height="36" rx="12" fill="#c3d3ea"/>
      <path d="M180 226l20 24 20-24" fill="none" stroke="#065f46" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="200" cy="172" r="31" fill="#d6e4f5"/>
      <path d="M169 176a31 31 0 0 1 62-4c-8-2-16-6-22-12-10 10-24 14-40 16z" fill="#0a1f3c"/>
      <rect x="84" y="262" width="72" height="14" rx="7" fill="#061426" opacity=".75"/>
      <circle cx="95" cy="269" r="3" fill="#6ee7a8"/>
    </g>
    <rect x="70" y="78" width="280" height="210" rx="16" fill="none" stroke="#6ee7a8" stroke-width="2.5"/>

    <!-- The entrepreneur's own camera -->
    <g clip-path="url(#self)">
      <rect x="268" y="214" width="70" height="62" fill="#173f73"/>
      <ellipse cx="303" cy="282" rx="22" ry="18" fill="#1d4f8f"/>
      <circle cx="303" cy="243" r="11" fill="#aec8ea"/>
      <path d="M292 243a11 11 0 0 1 22 0c-2-6-6-8-11-8s-9 2-11 8z" fill="#0f2d56"/>
    </g>
    <rect x="268" y="214" width="70" height="62" rx="8" fill="none" stroke="#1d4f8f" stroke-width="2"/>

    <!-- Call toolbar -->
    <rect x="150" y="300" width="120" height="28" rx="14" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="1.5"/>
    <circle cx="172" cy="314" r="8" fill="#173f73"/>
    <rect x="170" y="309.5" width="4" height="7" rx="2" fill="#e2e8f0"/>
    <circle cx="196" cy="314" r="8" fill="#173f73"/>
    <rect x="191" y="311" width="7" height="6" rx="1.2" fill="#e2e8f0"/>
    <path d="m198 314 3.5-2.2v4.4z" fill="#e2e8f0"/>
    <circle cx="220" cy="314" r="8" fill="#173f73"/>
    <path d="M215.5 311h9v5.5h-5l-3 2.2v-2.2h-1z" fill="#e2e8f0"/>
    <rect x="236" y="306" width="26" height="16" rx="8" fill="#ef4444"/>
    <rect x="243" y="312.5" width="12" height="3.5" rx="1.75" fill="#fff"/>

    <!-- Idea bubble -->
    <path d="M314 38h84a14 14 0 0 1 14 14v26a14 14 0 0 1-14 14h-58l-18 14 4-14h-12a14 14 0 0 1-14-14V52a14 14 0 0 1 14-14z" fill="#6ee7a8"/>
    <circle cx="333" cy="60" r="9" fill="none" stroke="#061426" stroke-width="2.5"/>
    <path d="M329.5 72h7M330.5 77h5" stroke="#061426" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="352" y="54" width="44" height="6" rx="3" fill="#061426" opacity=".55"/>
    <rect x="352" y="66" width="30" height="6" rx="3" fill="#061426" opacity=".55"/>

    <!-- Link from the mentor to the plan -->
    <g stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7">
      <line x1="350" y1="170" x2="430" y2="170"/>
    </g>
    <circle cx="390" cy="170" r="4" fill="#6ee7a8"/>

    <!-- Business plan -->
    <rect x="430" y="44" width="250" height="330" rx="14" fill="#f8fafc" filter="url(#shadow)"/>
    <rect x="450" y="66" width="120" height="12" rx="6" fill="#0a1f3c"/>
    <rect x="450" y="86" width="160" height="7" rx="3.5" fill="#cbd5e1"/>
    <circle cx="656" cy="72" r="5" fill="#10b77f"/>
    <circle cx="648" cy="65" r="2.5" fill="#10b77f" opacity=".8"/>
    <circle cx="664" cy="65" r="2.5" fill="#10b77f" opacity=".8"/>
    <circle cx="648" cy="79" r="2.5" fill="#10b77f" opacity=".8"/>
    <circle cx="664" cy="79" r="2.5" fill="#10b77f" opacity=".8"/>
    <rect x="450" y="106" width="210" height="1.5" fill="#e2e8f0"/>

    <g>
      <circle cx="460" cy="128" r="8" fill="#34d399"/>
      <circle cx="460" cy="156" r="8" fill="#34d399"/>
      <circle cx="460" cy="184" r="8" fill="#34d399"/>
      <circle cx="460" cy="212" r="7" fill="none" stroke="#cbd5e1" stroke-width="2"/>
      <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m456.5 128 2.5 2.5 4.5-4.5"/>
        <path d="m456.5 156 2.5 2.5 4.5-4.5"/>
        <path d="m456.5 184 2.5 2.5 4.5-4.5"/>
      </g>
      <g fill="#cbd5e1">
        <rect x="476" y="124" width="120" height="8" rx="4"/>
        <rect x="476" y="152" width="96" height="8" rx="4"/>
        <rect x="476" y="180" width="132" height="8" rx="4"/>
        <rect x="476" y="208" width="84" height="8" rx="4" opacity=".6"/>
      </g>
    </g>

    <!-- Growth chart -->
    <rect x="450" y="234" width="210" height="122" rx="10" fill="#ecfdf4"/>
    <rect x="462" y="246" width="54" height="6" rx="3" fill="#a7f3cb"/>
    <path d="M464 340V318l36-10 36 6 36-24 36-8 36-28v86z" fill="#6ee7a8" opacity=".45"/>
    <polyline points="464,318 500,308 536,314 572,290 608,282 644,254" fill="none" stroke="#10b77f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="m644 254-11 1 5 8z" fill="#10b77f"/>
    <g fill="#fff" stroke="#10b77f" stroke-width="2.5">
      <circle cx="500" cy="308" r="3.5"/>
      <circle cx="572" cy="290" r="3.5"/>
      <circle cx="608" cy="282" r="3.5"/>
    </g>
    <rect x="462" y="340" width="186" height="1.5" fill="#a7f3cb"/>

    <!-- Network nodes: goal and team -->
    <g stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7">
      <line x1="680" y1="130" x2="712" y2="116"/>
      <line x1="680" y1="290" x2="714" y2="300"/>
    </g>
    <circle cx="736" cy="108" r="32" fill="#6ee7a8" opacity=".18"/>
    <circle cx="736" cy="108" r="23" fill="#6ee7a8"/>
    <g fill="none" stroke="#061426" stroke-width="2.4" stroke-linecap="round">
      <circle cx="735" cy="109" r="11"/>
      <circle cx="735" cy="109" r="5.5"/>
      <path d="M735 109l11-11m0 0h-5m5 0v5"/>
    </g>
    <circle cx="738" cy="304" r="32" fill="#6ee7a8" opacity=".18"/>
    <circle cx="738" cy="304" r="23" fill="#6ee7a8"/>
    <g fill="none" stroke="#061426" stroke-width="2.4" stroke-linecap="round">
      <circle cx="732" cy="299" r="4.5"/>
      <path d="M723 314a9 9 0 0 1 18 0"/>
      <circle cx="745" cy="297" r="3.5"/>
      <path d="M743 305a7 7 0 0 1 9 7"/>
    </g>
  </g>
</svg>
