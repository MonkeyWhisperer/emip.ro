<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- Online demo of the platform: a shared screen with an eMIP-style dashboard and a video
       call's toolbar, the participants' video tiles beside it. Site colours (navy, mint). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2d56"/>
      <stop offset="1" stop-color="#061426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity=".2"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#aec8ea" opacity=".12"/>
    </pattern>
    <clipPath id="screen"><rect x="152" y="74" width="396" height="252" rx="8"/></clipPath>
    <clipPath id="tile1"><rect x="584" y="62" width="160" height="84" rx="12"/></clipPath>
    <clipPath id="tile2"><rect x="584" y="158" width="160" height="84" rx="12"/></clipPath>
    <clipPath id="tile3"><rect x="584" y="254" width="160" height="84" rx="12"/></clipPath>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <g transform="translate(-42 6)">
    <!-- Monitor -->
    <rect x="140" y="62" width="420" height="276" rx="16" fill="#0a1f3c" stroke="#1d4f8f" stroke-width="2"/>
    <path d="M330 338h40l8 28h-56z" fill="#173f73"/>
    <rect x="290" y="364" width="120" height="10" rx="5" fill="#1d4f8f"/>

    <g clip-path="url(#screen)">
      <rect x="152" y="74" width="396" height="252" fill="#061426"/>

      <!-- Window bar -->
      <rect x="152" y="74" width="396" height="22" fill="#0f2d56"/>
      <circle cx="164" cy="85" r="3" fill="#1d4f8f"/>
      <circle cx="174" cy="85" r="3" fill="#1d4f8f"/>
      <circle cx="184" cy="85" r="3" fill="#1d4f8f"/>
      <rect x="214" y="80" width="170" height="10" rx="5" fill="#0a1f3c"/>

      <!-- Sidebar with the logo and menu -->
      <rect x="152" y="96" width="50" height="194" fill="#0a1f3c"/>
      <circle cx="177" cy="112" r="5" fill="#6ee7a8"/>
      <circle cx="169" cy="105" r="2.5" fill="#6ee7a8" opacity=".8"/>
      <circle cx="185" cy="105" r="2.5" fill="#6ee7a8" opacity=".8"/>
      <circle cx="169" cy="119" r="2.5" fill="#6ee7a8" opacity=".8"/>
      <circle cx="185" cy="119" r="2.5" fill="#6ee7a8" opacity=".8"/>
      <rect x="164" y="136" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
      <rect x="158" y="150" width="38" height="14" rx="5" fill="#6ee7a8" opacity=".15"/>
      <rect x="164" y="154" width="26" height="6" rx="3" fill="#6ee7a8"/>
      <rect x="164" y="172" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
      <rect x="164" y="190" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>
      <rect x="164" y="208" width="26" height="6" rx="3" fill="#94a3b8" opacity=".35"/>

      <!-- KPI cards -->
      <rect x="214" y="108" width="100" height="38" rx="8" fill="#0f2d56"/>
      <rect x="224" y="118" width="40" height="5" rx="2.5" fill="#94a3b8" opacity=".5"/>
      <rect x="224" y="129" width="52" height="9" rx="4.5" fill="#e2e8f0"/>
      <rect x="326" y="108" width="100" height="38" rx="8" fill="#0f2d56"/>
      <rect x="336" y="118" width="40" height="5" rx="2.5" fill="#94a3b8" opacity=".5"/>
      <rect x="336" y="129" width="46" height="9" rx="4.5" fill="#6ee7a8"/>
      <rect x="388" y="129" width="24" height="9" rx="4.5" fill="#34d399" opacity=".3"/>
      <rect x="438" y="108" width="100" height="38" rx="8" fill="#0f2d56"/>
      <rect x="448" y="118" width="40" height="5" rx="2.5" fill="#94a3b8" opacity=".5"/>
      <rect x="448" y="129" width="58" height="9" rx="4.5" fill="#e2e8f0"/>

      <!-- Progress chart -->
      <rect x="214" y="156" width="210" height="124" rx="8" fill="#0f2d56"/>
      <rect x="226" y="166" width="60" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
      <g fill="#6ee7a8">
        <rect x="230" y="244" width="12" height="26" rx="3" opacity=".45"/>
        <rect x="252" y="230" width="12" height="40" rx="3" opacity=".5"/>
        <rect x="274" y="238" width="12" height="32" rx="3" opacity=".55"/>
        <rect x="296" y="218" width="12" height="52" rx="3" opacity=".6"/>
        <rect x="318" y="224" width="12" height="46" rx="3" opacity=".7"/>
        <rect x="340" y="206" width="12" height="64" rx="3" opacity=".8"/>
        <rect x="362" y="212" width="12" height="58" rx="3" opacity=".9"/>
        <rect x="384" y="194" width="12" height="76" rx="3"/>
      </g>
      <polyline points="236,238 258,224 280,232 302,212 324,218 346,200 368,206 390,188" fill="none" stroke="#a7f3cb" stroke-width="2" stroke-linejoin="round"/>

      <!-- Task list -->
      <rect x="432" y="156" width="106" height="124" rx="8" fill="#0f2d56"/>
      <g stroke="#061426" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="446" cy="176" r="5.5" fill="#34d399" stroke="none"/><path d="m443.5 176 2 2 3.5-3.5"/>
        <circle cx="446" cy="198" r="5.5" fill="#34d399" stroke="none"/><path d="m443.5 198 2 2 3.5-3.5"/>
        <circle cx="446" cy="220" r="5.5" fill="#34d399" stroke="none"/><path d="m443.5 220 2 2 3.5-3.5"/>
      </g>
      <circle cx="446" cy="242" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity=".6"/>
      <circle cx="446" cy="264" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity=".6"/>
      <g fill="#94a3b8" opacity=".45">
        <rect x="458" y="173" width="66" height="6" rx="3"/>
        <rect x="458" y="195" width="54" height="6" rx="3"/>
        <rect x="458" y="217" width="62" height="6" rx="3"/>
        <rect x="458" y="239" width="48" height="6" rx="3"/>
        <rect x="458" y="261" width="58" height="6" rx="3"/>
      </g>

      <!-- Video call toolbar -->
      <rect x="152" y="290" width="396" height="36" fill="#0a1f3c"/>
      <rect x="152" y="290" width="396" height="1" fill="#1d4f8f"/>
      <circle cx="168" cy="308" r="4" fill="#ef4444"/>
      <rect x="178" y="305" width="30" height="6" rx="3" fill="#94a3b8" opacity=".4"/>
      <circle cx="296" cy="308" r="10" fill="#173f73"/>
      <rect x="293.5" y="302" width="5" height="8" rx="2.5" fill="#e2e8f0"/>
      <path d="M292 308a4 4 0 0 0 8 0M296 312v2.5" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="324" cy="308" r="10" fill="#173f73"/>
      <rect x="318" y="304.5" width="8" height="7" rx="1.5" fill="#e2e8f0"/>
      <path d="m326 308 4-2.5v5z" fill="#e2e8f0"/>
      <circle cx="352" cy="308" r="10" fill="#6ee7a8"/>
      <rect x="345.5" y="303" width="13" height="9" rx="1.5" fill="none" stroke="#061426" stroke-width="1.6"/>
      <path d="M352 310v-5m-2.2 2.2 2.2-2.2 2.2 2.2" fill="none" stroke="#061426" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="372" y="299" width="32" height="18" rx="9" fill="#ef4444"/>
      <rect x="381" y="306" width="14" height="4" rx="2" fill="#fff"/>
    </g>

    <!-- Presenter's pointer on the chart -->
    <circle cx="392" cy="192" r="11" fill="none" stroke="#6ee7a8" stroke-width="1.5" opacity=".7"/>
    <path d="M392 192v17l4.5-4 3 7 2.6-1.1-3-6.9h6z" fill="#fff" stroke="#061426" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Links from the screen to the participants -->
    <g stroke="#6ee7a8" stroke-width="1.5" stroke-dasharray="3 4" opacity=".6">
      <line x1="560" y1="104" x2="584" y2="104"/>
      <line x1="560" y1="200" x2="584" y2="200"/>
      <line x1="560" y1="296" x2="584" y2="296"/>
    </g>

    <!-- Participants -->
    <g clip-path="url(#tile1)">
      <rect x="584" y="62" width="160" height="84" fill="#0f2d56"/>
      <ellipse cx="664" cy="150" rx="34" ry="28" fill="#10b77f"/>
      <circle cx="664" cy="98" r="15" fill="#d6e4f5"/>
      <path d="M649 96a15 15 0 0 1 30 0c-4-6-9-8-15-8s-11 2-15 8z" fill="#0a1f3c"/>
      <rect x="592" y="128" width="40" height="10" rx="5" fill="#061426" opacity=".7"/>
    </g>
    <rect x="584" y="62" width="160" height="84" rx="12" fill="none" stroke="#6ee7a8" stroke-width="2.5"/>
    <g fill="#6ee7a8">
      <rect x="720" y="74" width="3" height="8" rx="1.5"/>
      <rect x="726" y="71" width="3" height="14" rx="1.5"/>
      <rect x="732" y="75" width="3" height="6" rx="1.5"/>
    </g>

    <g clip-path="url(#tile2)">
      <rect x="584" y="158" width="160" height="84" fill="#173f73"/>
      <ellipse cx="664" cy="246" rx="34" ry="28" fill="#1d4f8f"/>
      <circle cx="664" cy="194" r="15" fill="#aec8ea"/>
      <path d="M649 193a15 15 0 0 1 30 0c-2-9-8-12-15-12s-13 3-15 12z" fill="#0f2d56"/>
      <rect x="592" y="224" width="40" height="10" rx="5" fill="#061426" opacity=".7"/>
    </g>
    <rect x="584" y="158" width="160" height="84" rx="12" fill="none" stroke="#1d4f8f" stroke-width="2"/>

    <g clip-path="url(#tile3)">
      <rect x="584" y="254" width="160" height="84" fill="#0f2d56"/>
      <ellipse cx="664" cy="342" rx="34" ry="28" fill="#173f73"/>
      <path d="M647 292a17 17 0 0 1 34 0v18h-7v-16a10 10 0 0 0-20 0v16h-7z" fill="#061426"/>
      <circle cx="664" cy="291" r="14" fill="#d6e4f5"/>
      <path d="M650 289a14 14 0 0 1 28 0c-5-6-9-8-14-8s-9 2-14 8z" fill="#061426"/>
      <rect x="592" y="320" width="40" height="10" rx="5" fill="#061426" opacity=".7"/>
    </g>
    <rect x="584" y="254" width="160" height="84" rx="12" fill="none" stroke="#1d4f8f" stroke-width="2"/>
  </g>
</svg>
